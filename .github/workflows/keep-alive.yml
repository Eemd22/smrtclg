name: Keep Server Alive

on:
  schedule:
    - cron: '*/5 * * * *'  # كل 5 دقائق
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Server
        run: |
          curl -f https://smartapp-api-mcf5.onrender.com/health || echo "Server responded"
          echo "Ping completed at $(date)"
